name: focus-project tests

on:
  push:
    branches: [main]
    # The workflow's own file counts as focus_project: editing only this file would
    # otherwise trigger nothing, so a fix to the job itself could never prove
    # itself.
    paths: ['focus_project/**', '.github/workflows/focus-project-tests.yml']
  pull_request:
    branches: [main]
    paths: ['focus_project/**', '.github/workflows/focus-project-tests.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: focus_project
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: focus_project/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt && pip install --no-deps -e .

      - name: Run tests with coverage
        run: python -m pytest -v
