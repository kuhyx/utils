name: shared gate tests

# The gates in this repo are enforced in ~40 other repos, so a bug here is a
# bug everywhere at once. Until now `md_naming` had a test suite that no
# workflow ran; `dep_freshness` ships with one from day one.
#
# The dependency-freshness suite never touches the network -- every registry
# answer is a fixture, because the gate's worst failure mode (accepting a
# pre-release as "latest stable") fails GREEN and only a fixture can pin it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  shared-gate-tests:
    name: gate unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pyyaml packaging

      - name: dep_freshness
        run: |
          PYTHONPATH=. python -m pytest dep_freshness/tests -q

      - name: md_naming
        run: PYTHONPATH=. python -m pytest md_naming/tests -q

      - name: file_length
        run: |
          PYTHONPATH=. python -m pytest file_length/tests -q

      - name: repo_contract
        run: |
          PYTHONPATH=. python -m pytest repo_contract/tests -q

      # Every web repo's pre-commit and CI run this checker against its dist/,
      # so a false green here ships an un-agent-ready site fleet-wide.
      - name: agent_ready
        run: |
          PYTHONPATH=. python -m pytest agent_ready/tests -q

      - name: coverage_gaps
        run: |
          PYTHONPATH=. python -m pytest coverage_gaps/tests -q

      # Its tests build throwaway repos with git, which the runner has.
      - name: devstats
        run: |
          PYTHONPATH=. python -m pytest devstats/tests -q

      # gate_stamp.sh is the pre-push gate in every repo. Its tests drive real
      # pre-commit in throwaway repos, and the hook-id helper runs under
      # /usr/bin/python3 (the deployment interpreter), hence apt's PyYAML.
      - name: gate_stamp (step / full --list)
        run: |
          sudo apt-get update -q && sudo apt-get install -y python3-yaml
          python -m pip install --upgrade pre-commit
          PYTHONPATH=. python -m pytest scripts/tests -q
