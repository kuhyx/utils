name: crdt_sync_dart tests

on:
  push:
    branches: [main]
    paths: ['crdt_sync_dart/**']
  pull_request:
    branches: [main]
    paths: ['crdt_sync_dart/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crdt_sync_dart

    steps:
      - uses: actions/checkout@v4

      # Pure Dart, no Flutter dependency -- so setup-dart, not flutter-action.
      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test
