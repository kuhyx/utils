name: repo-contract

# utils owns the shared gate, so it runs its own copy directly (no shim, no
# second checkout). Other repos use repo_contract/templates/repo-contract.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repo-contract:
    name: repo contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce the repo contract
        run: bash scripts/check_repo_contract.sh
