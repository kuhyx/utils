name: google_account_token tests

on:
  push:
    branches: [main]
    paths: ['google_account_token/**']
  pull_request:
    branches: [main]
    paths: ['google_account_token/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google_account_token

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test
