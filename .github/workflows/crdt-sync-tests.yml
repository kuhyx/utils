name: crdt-sync tests

on:
  push:
    branches: [main]
    paths: ['crdt-sync/**']
  pull_request:
    branches: [main]
    paths: ['crdt-sync/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crdt-sync
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        run: python -m pytest -v
