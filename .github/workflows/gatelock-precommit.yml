name: gatelock pre-commit

on:
  push:
    branches: [main]
    # The workflow's own file counts as gatelock: editing only this file used
    # to trigger nothing, so a fix to the job itself could never prove itself.
    paths: ['gatelock/**', '.github/workflows/gatelock-precommit.yml']
  pull_request:
    branches: [main]
    paths: ['gatelock/**', '.github/workflows/gatelock-precommit.yml']

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: gatelock
        run: pip install -r requirements.txt
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --config gatelock/.pre-commit-config.yaml --all-files
