name: ts_core tests

on:
  push:
    branches: [main]
    paths: ['ts_core/**']
  pull_request:
    branches: [main]
    paths: ['ts_core/**']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ts_core

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Run tests with the 100% coverage gate
        run: pnpm coverage

      # The tag ships a prebuilt dist/ because Vite does not transpile
      # dependencies. A committed dist/ that does not match src/ would ship
      # stale code to every consumer with no error anywhere, so rebuild and
      # fail if the result differs from what is checked in.
      - name: dist/ is in sync with src/
        run: |
          pnpm build
          if ! git diff --exit-code -- dist; then
            echo "::error::dist/ is stale — run 'pnpm build' in ts_core and commit the result."
            exit 1
          fi
