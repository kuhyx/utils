name: crdt-sync pre-commit

on:
  push:
    branches: [main]
    paths: ['crdt-sync/**', '.github/workflows/crdt-sync-precommit.yml']
  pull_request:
    branches: [main]
    paths: ['crdt-sync/**', '.github/workflows/crdt-sync-precommit.yml']

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # Only pre-commit itself. Every linting hook runs in its own isolated
      # env -- ruff, mypy, pylint, bandit and codespell each come from their
      # own repo+rev, and the local hooks need nothing beyond bash and
      # python3 -- so installing the full requirements.txt spent 9s a run on
      # packages no pre-commit-stage hook imports. Verified by running all
      # three configs green in a venv holding pre-commit and nothing else.
      # The pin is read out of requirements.txt rather than repeated here, so
      # it cannot drift from what the dependency-freshness gate governs.
      - name: Install pre-commit
        run: |
          pip install "$(grep '^pre-commit==' crdt-sync/requirements.txt)"

      # Keyed on THIS package's config. pre-commit/action@v3.0.1 caches on
      # hashFiles('.pre-commit-config.yaml') -- the repo ROOT's -- so all three
      # package jobs shared one key, raced to overwrite it with hook sets built
      # from four different configs, and editing a per-package config did not
      # invalidate it. The cache was therefore silently wrong rather than
      # missing, and the hooks reinstalled from scratch on every run (38-49s).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: >-
            pre-commit-crdt-sync-${{ env.pythonLocation }}-${{
            hashFiles('crdt-sync/.pre-commit-config.yaml') }}
          # Prefix fallback, or this fix would evaporate on the very
          # event that motivated it: bumping a hook rev changes the
          # exact key, and a total miss means reinstalling every hook
          # again. pre-commit's store is keyed internally by hook
          # repo+rev, so a superseded entry is ignored disk rather
          # than a wrong hook, and cache still re-saves under the new
          # exact key after a prefix-only hit.
          restore-keys: pre-commit-crdt-sync-${{ env.pythonLocation }}-
      - name: Run the hooks
        run: >-
          pre-commit run --config crdt-sync/.pre-commit-config.yaml
          --all-files --show-diff-on-failure
