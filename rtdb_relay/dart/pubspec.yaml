name: rtdb_relay
description: >-
  The Flutter client half of the sealed Firebase RTDB request relay (the PC
  half is the Python rtdb_relay next to this directory). Extracted from the
  tutor app; any app that talks to a PC worker over RTDB reuses it.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.13.5

dependencies:
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.14.1
      path: crdt_sync_dart
  crdt_sync_flutter:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_flutter-v0.9.0
      path: crdt_sync_flutter
  flutter:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  http: 1.6.0

dev_dependencies:
  fake_async: 1.3.3
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
