name: sync_settings_ui
description: >-
  Shared "Sync settings" screen (Firebase primary, optional local backup)
  reused across kuhy's Flutter apps. Pure UI + sync service layer over
  injected closures -- no keystore or platform plugin access lives in this
  package itself.
publish_to: 'none'
version: 0.7.3

environment:
  sdk: ^3.12.2

dependencies:
  crdt_sync:
    git:
      url: https://github.com/kuhyx/utils
      ref: crdt_sync_dart-v0.14.1
      path: crdt_sync_dart
  data_transfer_flutter:
    git:
      url: https://github.com/kuhyx/utils
      ref: data_transfer_flutter-v0.2.2
      path: data_transfer_flutter
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
