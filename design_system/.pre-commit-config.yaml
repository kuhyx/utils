# Pre-commit Configuration for design_system
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files

# NOTE: this subproject lives inside the ~/utils monorepo, whose git root is
# one level up. pre-commit always runs hooks from the git root, so every path
# below is written relative to THAT, not to this directory, and the top-level
# `files` key keeps these hooks off the sibling subprojects. CI invokes this
# config exactly the same way:
#   pre-commit run --config design_system/.pre-commit-config.yaml --all-files
files: ^design_system/

default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: file-length-cap
        name: file length <= 250 lines
        entry: bash scripts/check_file_length.sh
        language: system
        pass_filenames: true
      - id: subproject-scope
        name: subproject scope regex still matches
        entry: scripts/check_subproject_scope.sh design_system
        language: script
        # always_run so the top-level `files` filter cannot skip the one hook
        # whose job is to notice that filter has stopped matching anything.
        always_run: true
        pass_filenames: false
      - id: dart-format
        name: dart format --set-exit-if-changed
        entry: bash -c 'cd design_system && dart format --set-exit-if-changed lib test'
        language: system
        pass_filenames: false
      - id: flutter-analyze
        name: flutter analyze
        entry: bash -c 'cd design_system && flutter analyze'
        language: system
        pass_filenames: false
      - id: flutter-test-coverage
        name: flutter test --coverage with 100% line-coverage gate
        entry: >-
          bash -c 'cd design_system && flutter test --coverage &&
          scripts/check_coverage.sh coverage/lcov.info 100'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
