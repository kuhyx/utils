name: data_transfer_flutter
description: >-
  Shared "export to a JSON file / import from a JSON file" plumbing for kuhy's
  Flutter apps: system Save-as on Android/iOS (never cloud-only), a save
  dialog on desktop, a download on web, plus a versioned export envelope.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: 13.3.1
  file_selector: 1.1.0
  flutter:
    sdk: flutter
  path: 1.9.1
  path_provider: 2.1.6
  share_plus: 13.3.1

dev_dependencies:
  file_selector_platform_interface: 2.7.0
  flutter_test:
    sdk: flutter
  plugin_platform_interface: 2.1.8
  very_good_analysis: ^11.0.0

flutter:
