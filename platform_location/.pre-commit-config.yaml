# Pre-commit Configuration for platform_location
# Install:  pre-commit install && pre-commit install --hook-type pre-push
# Run:      pre-commit run --all-files

# NOTE: this subproject lives inside the ~/src/utils monorepo, whose git root is
# one level up. pre-commit always runs hooks from the git root, so every path
# below is written relative to THAT, not to this directory, and the top-level
# `files` key keeps these hooks off the sibling subprojects. CI invokes this
# config exactly the same way:
#   pre-commit run --config platform_location/.pre-commit-config.yaml --all-files
files: ^platform_location/

default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      - id: subproject-scope
        name: subproject scope regex still matches
        entry: scripts/check_subproject_scope.sh platform_location
        language: script
        # always_run so the top-level `files` filter cannot skip the one hook
        # whose job is to notice that filter has stopped matching anything.
        always_run: true
        pass_filenames: false
      - id: dart-format
        name: dart format --set-exit-if-changed
        entry: bash -c 'cd platform_location && dart format --set-exit-if-changed lib test'
        language: system
        pass_filenames: false
      - id: flutter-test
        name: flutter test
        entry: bash -c 'cd platform_location && flutter test'
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
